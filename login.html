<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Petugas Perpustakaan - SISPERPUS</title>
  <meta name="description" content="Masuk ke Panel Administrasi Perpustakaan Sekolah SISPERPUS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="bg-[#F6F2EA] text-stone-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-rose-900 selection:text-white">

  <!-- Top Simple Header -->
  <header class="py-4 px-6 border-b border-stone-200 bg-white">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 focus:outline-none focus:ring-2 focus:ring-rose-800 rounded-lg p-1">
        <div class="w-9 h-9 rounded-lg bg-rose-900 text-amber-200 flex items-center justify-center font-serif font-black text-lg shadow-xs">S</div>
        <div class="flex flex-col">
          <span class="font-serif font-bold text-base text-stone-900 tracking-tight leading-none">SISPERPUS</span>
          <span class="text-[10px] text-stone-500 font-medium tracking-wider uppercase">Perpustakaan Sekolah</span>
        </div>
      </a>
      <a href="index.html" class="text-xs font-semibold text-stone-600 hover:text-rose-900 transition-colors inline-flex items-center gap-1">
        <span>&larr;</span>
        <span>Katalog Publik Siswa</span>
      </a>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md bg-white rounded-2xl border border-stone-200 shadow-xl p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-rose-50 text-rose-900 border border-rose-200 mb-3 shadow-xs">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="font-serif text-2xl font-bold text-stone-900 mb-1">Masuk Panel Petugas</h1>
        <p class="text-xs sm:text-sm text-stone-500">Sistem Informasi Perpustakaan Sekolah Terpadu</p>
      </div>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label for="adminUsername" class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">NIP / Username Petugas</label>
          <input type="text" id="adminUsername" value="" required autofocus
            class="w-full text-xs sm:text-sm px-3.5 py-2.5 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-800 focus:border-rose-800 transition-shadow bg-stone-50/50"
            placeholder="Contoh: Admin" />
        </div>

        <div>
          <label for="adminPassword" class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">Kata Sandi</label>
          <div class="relative">
            <input type="password" id="adminPassword" value="" required
              class="w-full text-xs sm:text-sm px-3.5 py-2.5 pr-10 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-rose-800 focus:border-rose-800 transition-shadow bg-stone-50/50"
              placeholder="Masukkan kata sandi akun" autocomplete="current-password" />
            <button type="button" id="togglePasswordBtn"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-stone-400 hover:text-stone-700 focus:outline-none cursor-pointer"
              aria-label="Tampilkan atau sembunyikan kata sandi" title="Tampilkan/Sembunyikan kata sandi">
              <!-- Eye Icon (Show) -->
              <svg id="eyeIconOpen" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Slash Icon (Hide) -->
              <svg id="eyeIconClosed" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-stone-600 pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" checked class="rounded border-stone-300 text-rose-900 focus:ring-rose-800" />
            <span>Ingat sesi petugas ini</span>
          </label>
        </div>

        <div class="pt-2">
          <button type="submit" id="submitLoginBtn"
            class="w-full bg-rose-900 hover:bg-rose-950 text-white font-semibold text-xs sm:text-sm py-2.5 px-4 rounded-lg transition-colors cursor-pointer shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-800">
            Masuk ke Panel Admin
          </button>
        </div>
      </form>

      <div class="mt-6 pt-4 border-t border-stone-200 text-center">
        <p class="text-[11px] text-stone-500">
          Akses khusus petugas perpustakaan sekolah. Lupa kata sandi? Hubungi administrator IT sekolah.
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 px-6 border-t border-stone-200 text-center text-[11px] text-stone-500 bg-white">
    &copy; 2026 SISPERPUS &middot; Sistem Informasi Perpustakaan Sekolah Terpadu
  </footer>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4" aria-live="polite"></div>

  <script type="module" src="js/admin/login.js"></script>
</body>
</html>
