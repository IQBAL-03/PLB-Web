<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin Perpustakaan - SISPERPUS</title>
  <meta name="description" content="Panel Manajemen Perpustakaan Sekolah SISPERPUS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/tailwind.css" />
  <script>
    (function () {
      try {
        var token = localStorage.getItem('sisperpus_token');
        var user = JSON.parse(localStorage.getItem('sisperpus_user') || 'null');
        if (!token || !user || user.role !== 'admin') {
          window.location.replace('login.html');
        }
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body class="bg-[#F6F2EA] text-stone-800 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-900 selection:text-white">

  <!-- Admin Top Navbar (Hidden when printing PDF) -->
  <header class="no-print sticky top-0 z-40 bg-white border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-6">
          <a href="admin.html" class="flex items-center gap-2.5 focus:outline-none rounded-lg p-1">
            <div class="w-9 h-9 rounded-lg bg-rose-900 text-amber-200 flex items-center justify-center font-serif font-black text-lg shadow-xs">S</div>
            <div class="flex flex-col">
              <span class="font-serif font-bold text-base text-stone-900 tracking-tight leading-none">SISPERPUS</span>
              <span class="text-[10px] text-rose-800 font-bold uppercase tracking-wider">Panel Admin</span>
            </div>
          </a>

          <!-- Navigation Tabs -->
          <nav class="hidden md:flex items-center gap-2 text-xs font-semibold">
            <button type="button" data-admin-tab="dashboard" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-900 text-white shadow-xs cursor-pointer">
              Dashboard
            </button>
            <button type="button" data-admin-tab="members" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition-colors cursor-pointer">
              Daftar Anggota
            </button>
            <button type="button" data-admin-tab="books" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition-colors cursor-pointer">
              Kelola Buku
            </button>
            <button type="button" data-admin-tab="report" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition-colors cursor-pointer">
              Laporan &amp; Cetak PDF
            </button>
          </nav>
        </div>

        <div class="flex items-center gap-3">
          <a href="index.html" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-600 bg-stone-100 hover:bg-stone-200 transition-colors">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            <span>Katalog Siswa</span>
          </a>
          <div class="flex items-center gap-2 pl-2 border-l border-stone-200">
            <div class="hidden sm:flex flex-col text-right">
              <span id="adminCurrentUserName" class="text-xs font-bold text-stone-900 leading-none">Administrator</span>
              <span class="text-[10px] text-stone-500">Petugas Perpustakaan</span>
            </div>
            <button type="button" id="adminLogoutBtn" class="p-2 text-stone-500 hover:text-rose-900 hover:bg-rose-50 rounded-lg transition-colors cursor-pointer" title="Keluar dari Panel">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Navigation Tabs Strip -->
      <div class="flex md:hidden items-center gap-1.5 overflow-x-auto py-2 border-t border-stone-100 scrollbar-none text-xs">
        <button type="button" data-admin-tab="dashboard" class="px-2.5 py-1 rounded-md text-xs font-bold bg-rose-900 text-white whitespace-nowrap">Dashboard</button>
        <button type="button" data-admin-tab="members" class="px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:bg-stone-100 whitespace-nowrap">Anggota</button>
        <button type="button" data-admin-tab="books" class="px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:bg-stone-100 whitespace-nowrap">Buku</button>
        <button type="button" data-admin-tab="report" class="px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:bg-stone-100 whitespace-nowrap">Laporan</button>
      </div>
    </div>
  </header>

  <!-- Dynamic Content Container -->
  <main id="adminMainContainer" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

  <!-- Admin Footer -->
  <footer class="no-print mt-auto py-4 border-t border-stone-200 bg-white text-center text-xs text-stone-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>&copy; 2026 SISPERPUS. Panel Pengelolaan Perpustakaan Sekolah.</p>
      <p class="text-[11px] text-stone-400">Sesi Petugas Aktif &middot; Panel Administrasi</p>
    </div>
  </footer>

  <!-- Full Cover Image Lightbox Modal -->
  <div id="imagePreviewModal" class="fixed inset-0 z-60 hidden" role="dialog" aria-modal="true" aria-labelledby="imagePreviewCaption">
    <div id="imagePreviewBackdrop" class="fixed inset-0 bg-stone-950/80 backdrop-blur-xs transition-opacity cursor-pointer"></div>
    <div class="fixed inset-0 z-10 flex items-center justify-center p-4 sm:p-6 pointer-events-none">
      <div class="relative max-w-xl w-full flex flex-col items-center pointer-events-auto bg-stone-900/95 rounded-2xl p-4 shadow-2xl border border-stone-800">
        <button type="button" id="closeImagePreviewBtn" class="absolute top-3 right-3 p-1.5 text-stone-400 hover:text-white text-2xl font-bold leading-none cursor-pointer focus:outline-none" aria-label="Tutup pratinjau gambar">&times;</button>
        <img id="imagePreviewImg" src="" alt="Pratinjau Sampul Asli" class="max-h-[75vh] w-auto max-w-full object-contain rounded shadow-md mt-6" />
        <p id="imagePreviewCaption" class="mt-3 text-xs sm:text-sm text-stone-300 font-medium text-center"></p>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4" aria-live="polite"></div>

  <script type="module" src="js/admin/admin.js"></script>
</body>
</html>
